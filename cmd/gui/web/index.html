<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T-Invest GUI</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong data-i18n="title">T-Invest Портфель</strong><nav><button data-tab="portfolio" data-i18n="portfolio"></button><button data-tab="operations" data-i18n="operations"></button><button data-tab="instruments" data-i18n="instruments"></button><button data-tab="settings" data-i18n="settings"></button></nav></header>
<main><section id="toolbar"><input id="search" data-placeholder="search" placeholder="Поиск"><select id="group"><option value="">Группировка</option></select><input id="from" type="date"><input id="to" type="date"><button id="refresh" data-i18n="refresh"></button><button id="export" data-i18n="export"></button></section><div id="error" hidden></div><section id="filters" hidden><select id="type"><option value="">Все типы</option><option value="share">Акции</option><option value="bond">Облигации</option><option value="etf">ETF</option><option value="currency">Валюты</option><option value="future">Фьючерсы</option></select><input id="currency" placeholder="Валюта"><input id="exchange" placeholder="Биржа"><input id="sector" placeholder="Сектор"><select id="risk"><option value="">Риск</option><option>RISK_LEVEL_LOW</option><option>RISK_LEVEL_MODERATE</option><option>RISK_LEVEL_HIGH</option><option>RISK_LEVEL_UNSPECIFIED</option></select><select id="frequency"><option value="">Частота купона</option><option value="12">Месяц</option><option value="4">Квартал</option><option value="2">Полгода</option><option value="1">Год</option></select><select id="coupon_type"><option value="">Тип купона</option><option value="fixed">Фиксированный</option><option value="floating">Флоатер</option></select><input id="rate_from" type="number" step=".01" placeholder="Ставка от"><input id="rate_to" type="number" step=".01" placeholder="Ставка до"><input id="month" type="number" min="1" max="12" placeholder="Месяц купона"><button id="force">Обновить справочник</button><small id="updated"></small></section><div id="grid"><table><thead></thead><tbody></tbody></table></div><dialog id="details"><h3 data-i18n="details"></h3><pre></pre><button onclick="this.closest('dialog').close()">OK</button></dialog><section id="settings" hidden><form><label>Mode <select name="mode"><option>prod</option><option>sandbox</option></select></label><label>Token env <input name="token_env"></label><label>Reports <input name="reports_dir"></label><label>Target currency <input name="target_currency"></label><label>Retries <input name="retries" type="number"></label><label>Retry delay ms <input name="retry_delay_ms" type="number"></label><label>Auto refresh min <input name="auto_refresh_minutes" type="number"></label><label>Catalog TTL h <input name="catalog_ttl_hours" type="number"></label><label>Language <select name="language"><option value="ru">Русский</option><option value="en">English</option></select></label><button data-i18n="save"></button></form></section></main><script src="app.js"></script></body></html>
